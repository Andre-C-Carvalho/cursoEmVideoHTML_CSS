<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 14</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            border-collapse: collapse;
        }

        caption{
            font-size: 1.3em;
            padding-bottom: 20px;
        }

        td, th{
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }

        th{
            background-color: darkgray;
            color: white;
        }
        .media{
            text-align: left;
        }
    </style>
</head>
<body>

            </tr>
        </thead>

        <tbody>
            <tr>

            <tr>

            </tr>
            <tr>

            </tr>
            <tr>
                <th rowspan="2">Humanas</th>
                <td>História</td>

                <td>8</td>
            </tr>
            <tr>
                <td>Geografia</td>

            </tr>
            <tr>

        </tbody>
    </table>
</body>
</html>
