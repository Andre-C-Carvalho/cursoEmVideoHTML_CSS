<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste Input: Dia, Mês, Ano, Data, Hora</h1>
    <form action="cadastro.java" method="get" autocomplete="on">
        <p><label for="inome">Nome Completo: </label>
            <input type="text" name="nome" id="inome" minlength="4" maxlength="30" placeholder="Nome Completo" size="25" autocomplete="name">
        </p>
        <p><label for="imedia">Média: </label>
            <input type="number" name="media" id="imedia" placeholder="0 a 10" step=".01" min="0" max="10">
        </p>
        <h2>Anivesariantes:</h2>
        <p> 
            <label for="imes">Mês: </label>
            <input type="month" name="mes" id="imes">
        </p>
        <p>
            <label for="idia">Dia Prova:</label>
            <input type="date" name="datas" id="idia" value="2020-12-24">
            <label for="ihorario">Horário: </label>
            <input type="time" name="horario" id="ihorario" value="12:00">
        </p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>
</html>
