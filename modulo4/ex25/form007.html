<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário: Select, Datalist e Textarea</h1>
    <form action="cadastro.java" method="get">
        <p>
            <label for="iestado">Estado: </label>
            <select name="estado" id="iestado">
                <option value="">-- Escolha o Estado --</option>
                <optgroup label="Região Nordeste">
                    <option value="PE">Penambuco</option>
                    <option value="RN"> Rio Grande do Norte</option>
                    <option value="PB">Paraíba</option>
                    <option value="SE">Sergipe</option>
                    <option value="AL">Alagoas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="PI">Piauí</option>
                    <option value="MA">Maranhão</option>
                </optgroup>
                <optgroup  label="Região Sul">
                    <option value="PR">Paraná</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="RS">Rio Grande do Sul</option>
                </optgroup>
            </select>
                <p>
                    <label for="iprof">Profissão: </label>
                    <input type="text" name="prof" id="iprof" list="listaprof">
                    <datalist id="listaprof">
                        <option value="Pedreiro"></option>
                        <option value="Médico"></option>
                        <option value="Policial"></option>
                        <option value="Dentista"></option>
                    </datalist>
                </p>
            <p>
                <label for="imsg">Mensagem: </label><br>
                <textarea name="msg" id="imsg" cols="40" rows="10" placeholder="Deixe sua mensagem aqui..."></textarea>
            </p>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
        
    </form>
</body>
</html>
