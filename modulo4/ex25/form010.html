<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo 3: Tag output</h1>
    <p>Essa tela calcula sua idade.</p>
    <p>
        <label for="iano">Ano Nascimento: </label>
        <input type="number" name="ano" id="iano" min="1900" max="2024" oninput="calcIdade()">
    </p>
    <p>
        <label for="iidade">Em 2024 você completará:</label>
        <output id="iidade">0</output>
        <label for="iidade">anos.</label>
    </p>

    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
    <script>
        function calcIdade(){
          let atual = new Date().getFullYear()
          iidade.innerHTML = Number(atual) - Number(iano.value)      
        }
    </script>
</body>
</html>
