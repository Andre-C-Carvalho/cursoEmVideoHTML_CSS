<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form action="cadastro.java" method="GET" autocomplete="on">
        <h1>Teste de Formulário</h1>
        <p>
            <label for="iusuario">Usuário: </label>
            <input type="text" name="usuario" id="iusuario" autocomplete="username"   minlength="6" maxlength="15" size="10" required placeholder="min 6 caracteres">
        </p>
        <p>
            <label for="isenha">Senha: </label>
            <input type="password" name="senha" id="isenha" autocomplete="current-password"
            required minlength="4" maxlength="10" size="12" placeholder="min 4 caracteres">
        </p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>


</body>
</html>
